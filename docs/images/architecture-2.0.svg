<svg xmlns="http://www.w3.org/2000/svg" width="960" height="248" viewBox="0 0 960 248" role="img" aria-labelledby="title desc">
  <title id="title">Generator and generated-project responsibilities</title>
  <desc id="desc">The CLI supplies input to the generator, which validates an architecture blueprint, resolves Boot and delivers a project and ZIP. The consumer's Maven build runs ArchUnit and sample integration tests.</desc>
  <rect width="960" height="248" rx="16" fill="#f0f7f5"/>
  <g font-family="system-ui, sans-serif" fill="#142b33">
    <text x="24" y="40" font-size="22" font-weight="700">From CLI input to an enforced build</text>
    <g fill="#fff" stroke="#c7dbd7">
      <rect x="24" y="69" width="272" height="150" rx="10"/>
      <rect x="344" y="69" width="272" height="150" rx="10"/>
      <rect x="664" y="69" width="272" height="150" rx="10"/>
    </g>
    <g font-weight="700" font-size="19">
      <text x="44" y="107">Generator</text>
      <text x="364" y="107">Delivered project</text>
      <text x="684" y="107">Consumer build</text>
    </g>
    <g font-size="15">
      <text x="44" y="141">Validate input and layout</text>
      <text x="44" y="167">Resolve an exact Boot patch</text>
      <text x="364" y="141">Sources, Maven wrapper, POM</text>
      <text x="364" y="167">Architecture tests and ZIP</text>
      <text x="684" y="141">Maven verify runs ArchUnit</text>
      <text x="684" y="167">Sample integration tests run</text>
      <text x="684" y="193">when the sample is enabled</text>
    </g>
  </g>
  <path d="M307 144h22m-6-6 6 6-6 6m304-6h22m-6-6 6 6-6 6" fill="none" stroke="#096457" stroke-width="2"/>
</svg>
