<svg xmlns="http://www.w3.org/2000/svg" width="760" height="564" viewBox="0 0 760 564" role="img" aria-labelledby="title description">
  <title id="title">Executable architecture proof: green, red, green</title>
  <desc id="description">The generated Standard Strict project passes Maven verification. Adding a private LoggingGreetingAuditRepository field to GreetingController compiles, then fails ArchUnit at controllers_must_not_depend_on_repositories. Removing the field and import restores a passing build.</desc>
  <rect width="760" height="564" rx="24" fill="#101826"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="54" font-size="36" font-weight="730" fill="#eff5ff">One field fails verification</text>
    <text x="34" y="86" font-size="23" fill="#c3cede">Standard layout · Strict guardrails</text>
  </g>
  <path d="M56 147v348" stroke="#536c88" stroke-width="3"/>
  <g fill="#172436" stroke="#425670">
    <rect x="91" y="112" width="641" height="83" rx="13"/>
    <rect x="91" y="210" width="641" height="240" rx="13" stroke="#aa6469"/>
    <rect x="91" y="465" width="641" height="73" rx="13"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="25" font-weight="700">
    <circle cx="56" cy="153" r="17" fill="#204336" stroke="#69e6bd" stroke-width="2"/>
    <path d="m48 152 5 6 10-11" fill="none" stroke="#a1f1d5" stroke-width="2.6"/>
    <text x="112" y="147" fill="#a1f1d5">Baseline passes</text>
    <text x="112" y="178" fill="#c3cede" font-size="23" font-weight="400">Generated project verifies.</text>
    <circle cx="56" cy="248" r="17" fill="#4b2934" stroke="#ff9f9e" stroke-width="2"/>
    <path d="m50 242 12 12m0-12-12 12" stroke="#ffb9b6" stroke-width="2.6"/>
    <text x="112" y="248" fill="#ffb9b6">Compiles · ArchUnit fails</text>
    <circle cx="56" cy="502" r="17" fill="#204336" stroke="#69e6bd" stroke-width="2"/>
    <path d="m48 501 5 6 10-11" fill="none" stroke="#a1f1d5" stroke-width="2.6"/>
    <text x="112" y="496" fill="#a1f1d5">Restored build passes</text>
    <text x="112" y="524" fill="#c3cede" font-size="23" font-weight="400">Remove the field and import.</text>
  </g>
  <rect x="111" y="266" width="600" height="100" rx="8" fill="#101826"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#eff5ff" font-size="24">
    <text x="126" y="292" fill="#c3cede">GreetingController</text>
    <text x="126" y="324">private LoggingGreetingAuditRepository</text>
    <text x="168" y="352">__archViolation;</text>
    <text x="112" y="401" fill="#ffb9b6" aria-label="controllers_must_not_depend_on_repositories"><tspan x="112">controllers_must_not_</tspan><tspan x="112" dy="29">depend_on_repositories</tspan></text>
  </g>
</svg>
