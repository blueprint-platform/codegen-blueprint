<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title description">
  <title id="title">One compiling dependency fails ArchUnit</title>
  <desc id="description">The generated Standard project passes. Adding a field of type LoggingGreetingAuditRepository to GreetingController compiles and fails the controllers_must_not_depend_on_repositories rule. Removing the field and import restores the passing Maven verification.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#24404c" opacity=".58"/></pattern>
  </defs>
  <rect width="960" height="408" rx="20" fill="#0b1d29"/>
  <g font-family="system-ui, sans-serif" fill="#ecfaf6">
    <text x="29" y="52" font-size="34" font-weight="700">One compiling dependency fails ArchUnit</text>
    <text x="30" y="83" font-size="20" fill="#adc5cc">Standard layout · strict guardrails</text>
  </g>
  <rect x="26" y="106" width="908" height="201" rx="12" fill="url(#grid)" stroke="#395566"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ecfaf6">
    <text x="53" y="147" font-size="26">GreetingController</text>
    <text x="54" y="206" font-size="23">
      <tspan x="54">private LoggingGreetingAuditRepository</tspan>
      <tspan x="54" dy="30" xml:space="preserve">    __archViolation;</tspan>
    </text>
    <text x="53" y="283" font-size="23" fill="#ffbec2">controllers_must_not_depend_on_repositories</text>
  </g>
  <path d="M54 166h854" stroke="#395566"/>
  <path d="M54 257h854" stroke="#ff969f" stroke-dasharray="8 5" stroke-width="2"/>
  <path d="M54 339h852" stroke="#395566" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="21" font-weight="700">
    <circle cx="55" cy="339" r="7" fill="#3dedbf"/>
    <text x="52" y="379" fill="#a5f6dd">Baseline passes</text>
    <circle cx="480" cy="339" r="11" fill="#522e40" stroke="#ff969f" stroke-width="2"/>
    <path d="m476 335 8 8m0-8-8 8" stroke="#ffd0d2" stroke-width="2"/>
    <text x="480" y="379" text-anchor="middle" fill="#ffbec2">Compiles · ArchUnit fails</text>
    <circle cx="906" cy="339" r="7" fill="#3dedbf"/>
    <text x="909" y="379" text-anchor="end" fill="#a5f6dd">Restored build passes</text>
  </g>
</svg>
