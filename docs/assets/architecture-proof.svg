<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title description"><title id="title">An architecture violation that compiles but fails verification</title><desc id="description">A recorded green red green proof. A Standard Strict project first passes Maven verify. Adding a LoggingGreetingAuditRepository field to GreetingController compiles but fails the ArchUnit rule controllers_must_not_depend_on_repositories. Removing the field and import restores a passing Maven verification. The display illustrates the verified rule rather than reproducing a terminal log verbatim.</desc><defs>
 <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#087E72" stroke-width="1.5"/></marker>
 <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#B94350" stroke-width="1.5"/></marker>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="155%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#153754" flood-opacity="0.055"/></filter>
</defs><rect x="0" y="0" width="1200" height="890" rx="0" fill="#F7FAFC" stroke="none" stroke-width="1"/><rect x="44" y="40" width="7" height="52" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="70" y="73" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="39" font-weight="760" >One dependency. One failing build.</text><text x="70" y="111" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" >A compilable Java change is rejected by the generated architecture contract.</text><rect x="1020" y="53" width="130" height="28" rx="14" fill="#EAF8F3" stroke="none" stroke-width="1"/><text x="1085.0" y="72" fill="#087E72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >REAL PROOF</text><rect x="43" y="150" width="1114" height="135" rx="18" fill="#FFFFFF" stroke="#DCE7EC" stroke-width="1"/><rect x="68" y="172" width="306" height="88" rx="12" fill="#EAF8F3" stroke="none" stroke-width="1"/><rect x="83" y="188" width="6" height="55" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="104" y="206" fill="#087E72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="760" >01  BASELINE</text><text x="104" y="240" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="740" >BUILD SUCCESS</text><rect x="445" y="172" width="306" height="88" rx="12" fill="#FFF1F2" stroke="none" stroke-width="1"/><rect x="460" y="188" width="6" height="55" rx="3" fill="#B94350" stroke="none" stroke-width="1"/><text x="481" y="206" fill="#B94350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="760" >02  VIOLATION</text><text x="481" y="240" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="740" >ARCHUNIT FAILURE</text><rect x="822" y="172" width="306" height="88" rx="12" fill="#EAF8F3" stroke="none" stroke-width="1"/><rect x="837" y="188" width="6" height="55" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="858" y="206" fill="#087E72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="760" >03  RESTORED</text><text x="858" y="240" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="740" >BUILD SUCCESS</text><path d="M385 215 L429 215" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M760 215 L806 215" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><rect x="43" y="305" width="1114" height="390" rx="18" fill="#FFFFFF" stroke="#DCE7EC" stroke-width="1"/><text x="73" y="351" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="25" font-weight="750" >The change</text><text x="73" y="382" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" >A controller reaches directly into persistence.</text><rect x="72" y="415" width="1056" height="118" rx="12" fill="#15283F" stroke="none" stroke-width="1"/><rect x="91" y="431" width="145" height="28" rx="14" fill="#29445F" stroke="none" stroke-width="1"/><text x="163.5" y="450" fill="#D8F2F5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >GreetingController</text><text x="97" y="483" fill="#F4B5BE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="600" >+ private LoggingGreetingAuditRepository __archViolation = null;</text><text x="97" y="511" fill="#AEC5D7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" >// The dependency compiles, but the architecture test rejects it.</text><rect x="72" y="552" width="1056" height="119" rx="12" fill="#FFF1F2" stroke="#EFCFD4" stroke-width="1"/><text x="97" y="584" fill="#B94350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="760" >ARCHUNIT · EXPECTED FAILURE</text><text x="97" y="621" fill="#142741" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="690" >controllers_must_not_depend_on_repositories</text><text x="97" y="653" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" >Not a Java compiler error. The generated rule fails Maven verification.</text><rect x="43" y="718" width="1114" height="107" rx="16" fill="#EAF8F3" stroke="#C7E8DB" stroke-width="1"/><text x="75" y="757" fill="#087E72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" >RESTORE</text><text x="75" y="791" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="610" >Remove the field and import → run Maven verify → build passes again.</text><text x="69" y="859" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" >Reproduce the recorded result in docs/examples/boundary-proof.md  •  Source: recorded proof</text></svg>