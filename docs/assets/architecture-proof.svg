<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title desc"><title id="title">Executable architecture proof: green red green</title><desc id="desc">Generated Standard Strict project passes verification, a compiling Java field introduces a forbidden controller-to-repository reference and the ArchUnit controllers_must_not_depend_on_repositories rule fails, then restoring the source passes verification again.</desc><defs><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f8f8"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf9f4"/><stop offset="1" stop-color="#d9f0ee"/></linearGradient><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eaf3ff"/><stop offset="1" stop-color="#e1e9ff"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dce8ee" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#078d80" stroke-width="1.7"/></marker></defs><style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#11243e}.mono{font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}.muted{fill:#536b85}.teal{fill:#078d80}.red{fill:#bf3549}.white{fill:white}.bold{font-weight:750}.line{stroke:#078d80;stroke-width:3;fill:none;marker-end:url(#arrow)}.thin{stroke:#d9e4ee;stroke-width:1.5}.node{fill:white;stroke:#cfdfec;stroke-width:1.5}.small{font-size:17px}.nodeText{font-size:21px;font-weight:650}</style><rect width="1200" height="486" rx="24" fill="url(#paper)"/><rect x="1" y="1" width="1198" height="484" rx="23" fill="none" stroke="#d7e6ee"/><rect x="38" y="40" width="7" height="49" rx="3" fill="#078d80"/><text x="63" y="76" font-size="34" font-weight="760">A compiling change. A failing build.</text><text x="64" y="110" font-size="19" class="muted">Standard + Strict · controller depends on a repository · ArchUnit rejects it</text><rect x="44" y="143" width="309" height="110" rx="17" fill="#e3f5ed" stroke="#d7e5e5"/><circle cx="82" cy="198" r="19" fill="white"/><text x="82" y="204" font-size="19" font-weight="800" text-anchor="middle" style="fill:#007a62">✓</text><text x="113" y="180" font-size="17" font-weight="750" style="fill:#007a62">01  BASELINE</text><text x="113" y="218" font-size="24" font-weight="780">Build passes</text><rect x="446" y="143" width="309" height="110" rx="17" fill="#ffedf0" stroke="#d7e5e5"/><circle cx="484" cy="198" r="19" fill="white"/><text x="484" y="204" font-size="19" font-weight="800" text-anchor="middle" style="fill:#b73549">×</text><text x="515" y="180" font-size="17" font-weight="750" style="fill:#b73549">02  VIOLATION</text><text x="515" y="218" font-size="24" font-weight="780">ArchUnit fails</text><rect x="848" y="143" width="309" height="110" rx="17" fill="#e3f5ed" stroke="#d7e5e5"/><circle cx="886" cy="198" r="19" fill="white"/><text x="886" y="204" font-size="19" font-weight="800" text-anchor="middle" style="fill:#007a62">✓</text><text x="917" y="180" font-size="17" font-weight="750" style="fill:#007a62">03  RESTORED</text><text x="917" y="218" font-size="24" font-weight="780">Build passes</text><path d="M367 197h67" class="line"/><path d="M769 197h67" class="line"/><rect x="44" y="281" width="1112" height="153" rx="16" fill="#fff" stroke="#cfdfeb"/><rect x="44" y="281" width="1112" height="36" rx="16" fill="#eaf2f7"/><rect x="44" y="302" width="1112" height="15" fill="#eaf2f7"/><circle cx="68" cy="300" r="5" fill="#d48b8f"/><circle cx="86" cy="300" r="5" fill="#dfc27a"/><circle cx="104" cy="300" r="5" fill="#83c9b8"/><text x="128" y="306" class="mono" font-size="15" fill="#49647b">GreetingController.java · injected field</text><text x="72" y="358" font-size="19" font-weight="700" style="fill:#bf3549">+</text><text x="104" y="358" class="mono" font-size="19">private LoggingGreetingAuditRepository __archViolation = null;</text><rect x="67" y="378" width="1064" height="35" rx="8" fill="#fff0f2"/><text x="86" y="401" class="mono" font-size="18" font-weight="690" style="fill:#a82b42">controllers_must_not_depend_on_repositories</text><text x="47" y="467" font-size="16" class="muted">The field is removed after the expected ArchUnit failure; the same Maven verification passes again.</text></svg>