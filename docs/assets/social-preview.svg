<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Codegen Blueprint</title>
  <desc id="description">Architecture as an Executable Contract. Generate Spring Boot projects, enforce dependencies with Maven and reproduce a boundary failure. A three-stage diagram reads Generate, Enforce, Prove.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101826"/><stop offset="1" stop-color="#172c40"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#69e6bd" stroke-width="1.4"/></marker>
  </defs>
  <rect width="1280" height="640" fill="url(#surface)"/>
  <rect x="67" y="65" width="1146" height="510" rx="30" fill="#101826" stroke="#536c88" stroke-width="2"/>
  <rect x="592" y="117" width="96" height="5" rx="2.5" fill="#69e6bd"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="640" y="230" font-size="91" font-weight="750" fill="#eff5ff">Codegen Blueprint</text>
    <text x="640" y="301" font-size="43" font-weight="630" fill="#a1f1d5">Architecture as an Executable Contract</text>
    <text x="640" y="359" font-size="31" fill="#c3cede">Spring Boot projects with build-time guardrails</text>
  </g>
  <g fill="#22354a" stroke="#536c88" stroke-width="2">
    <rect x="184" y="431" width="240" height="75" rx="12"/>
    <rect x="520" y="431" width="240" height="75" rx="12"/>
    <rect x="856" y="431" width="240" height="75" rx="12"/>
  </g>
  <g stroke="#69e6bd" stroke-width="3.5" fill="none">
    <path d="M426 468h91" marker-end="url(#arrow)"/>
    <path d="M762 468h91" marker-end="url(#arrow)"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-size="31" fill="#eff5ff">
    <text x="304" y="479">Generate</text><text x="640" y="479">Enforce</text><text x="976" y="479">Prove</text>
  </g>
</svg>
