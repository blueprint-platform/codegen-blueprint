<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title description"><title id="title">Standard and Hexagonal architecture dependency boundaries</title><desc id="description">Two diagrams illustrate source-code dependency direction. Standard: controller references service, service references repository, while controller directly referencing repository is forbidden. Hexagonal: incoming adapter references inbound application port; use case references outbound application port and domain; outgoing adapter references outbound port. An application-to-adapter reference is forbidden. Bootstrap wires components, not shown as a dependency edge.</desc><defs>
 <marker id="teal-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#087E72" stroke-width="1.5"/></marker>
 <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#B94350" stroke-width="1.5"/></marker>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="155%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#153754" flood-opacity="0.055"/></filter>
</defs><rect x="0" y="0" width="1200" height="970" rx="0" fill="#F7FAFC" stroke="none" stroke-width="1"/><rect x="44" y="42" width="7" height="52" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="70" y="76" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="750" >Architecture, enforced at build time</text><text x="70" y="113" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="400" >Source dependencies — arrows point to the types being referenced</text><rect x="1024" y="55" width="128" height="28" rx="14" fill="#EAF8F3" stroke="none" stroke-width="1"/><text x="1088.0" y="74" fill="#087E72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >ARCHUNIT</text><rect x="43" y="145" width="1114" height="328" rx="20" fill="#FFFFFF" stroke="#DCE7EC" stroke-width="1"/><rect x="70" y="171" width="122" height="28" rx="14" fill="#EDF4FA" stroke="none" stroke-width="1"/><text x="131.0" y="190" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >01  STANDARD</text><text x="70" y="237" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="750" >Layered</text><text x="70" y="271" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" >Controller / service / repository</text><rect x="470" y="220" width="195" height="90" rx="14" fill="#FFFFFF" stroke="#CADAE4" stroke-width="1.6"/><rect x="470" y="220" width="195" height="7" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="567.5" y="265" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >CONTROLLER</text><text x="567.5" y="291" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" >HTTP boundary</text><rect x="698" y="220" width="195" height="90" rx="14" fill="#FFFFFF" stroke="#CADAE4" stroke-width="1.6"/><rect x="698" y="220" width="195" height="7" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="795.5" y="265" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >SERVICE</text><text x="795.5" y="291" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" >Use cases</text><rect x="926" y="220" width="195" height="90" rx="14" fill="#FFFFFF" stroke="#CADAE4" stroke-width="1.6"/><rect x="926" y="220" width="195" height="7" rx="3" fill="#087E72" stroke="none" stroke-width="1"/><text x="1023.5" y="265" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="740" text-anchor="middle" >REPOSITORY</text><text x="1023.5" y="291" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" >Persistence</text><path d="M665 265 L693 265" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M893 265 L921 265" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><rect x="470" y="337" width="651" height="103" rx="14" fill="#FFF7F7" stroke="#F2D5D8" stroke-width="1"/><rect x="492" y="357" width="150" height="28" rx="14" fill="#FFF1F2" stroke="none" stroke-width="1"/><text x="567.0" y="376" fill="#B94350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >FORBIDDEN EDGE</text><text x="661" y="377" fill="#142741" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="650" >controller</text><path d="M796 369 L844 369" fill="none" stroke="#B94350" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#red-arrow)"/><text x="863" y="377" fill="#142741" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" font-weight="650" >repository</text><text x="492" y="418" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" >Direct controller → repository references fail the selected ArchUnit rule.</text><rect x="43" y="493" width="1114" height="385" rx="20" fill="#FFFFFF" stroke="#DCE7EC" stroke-width="1"/><rect x="70" y="518" width="135" height="28" rx="14" fill="#EDF4FA" stroke="none" stroke-width="1"/><text x="137.5" y="537" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" >02  HEXAGONAL</text><text x="70" y="582" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="33" font-weight="750" >Ports &amp; adapters</text><text x="70" y="614" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" >Domain and use cases remain independent of concrete adapters.</text><rect x="322" y="659" width="184" height="77" rx="12" fill="#EDF4FA" stroke="#C9DCE4" stroke-width="1.4"/><rect x="322" y="659" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="414.0" y="690" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >adapter.in</text><text x="414.0" y="714" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >REST / CLI</text><rect x="555" y="659" width="194" height="77" rx="12" fill="#EAF8F3" stroke="#C9DCE4" stroke-width="1.4"/><rect x="555" y="659" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="652.0" y="690" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >port.in</text><text x="652.0" y="714" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >Inbound contract</text><rect x="800" y="659" width="184" height="77" rx="12" fill="#FFFFFF" stroke="#C9DCE4" stroke-width="1.4"/><rect x="800" y="659" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="892.0" y="690" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >use case</text><text x="892.0" y="714" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >Application</text><rect x="800" y="763" width="184" height="77" rx="12" fill="#EAF8F3" stroke="#C9DCE4" stroke-width="1.4"/><rect x="800" y="763" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="892.0" y="794" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >port.out</text><text x="892.0" y="818" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >Outbound contract</text><rect x="555" y="763" width="194" height="77" rx="12" fill="#EDF4FA" stroke="#C9DCE4" stroke-width="1.4"/><rect x="555" y="763" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="652.0" y="794" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >adapter.out</text><text x="652.0" y="818" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >Infrastructure</text><rect x="1006" y="763" width="126" height="77" rx="12" fill="#FFFFFF" stroke="#C9DCE4" stroke-width="1.4"/><rect x="1006" y="763" width="5" height="77" rx="2" fill="#087E72" stroke="none" stroke-width="1"/><text x="1069.0" y="794" fill="#142741" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="720" text-anchor="middle" >domain</text><text x="1069.0" y="818" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" >Core</text><path d="M506 697 L549 697" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M801 697 L756 697" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M892 736 L892 757" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M749 801 L794 801" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><path d="M984 686 H1069 V757" fill="none" stroke="#087E72" stroke-width="3" stroke-linecap="round" marker-end="url(#teal-arrow)"/><rect x="70" y="674" width="210" height="160" rx="14" fill="#FFF6F7" stroke="#F0D5D9" stroke-width="1"/><text x="90" y="711" fill="#B94350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="760" >PROHIBITED</text><text x="90" y="752" fill="#142741" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="650" >application</text><text x="90" y="783" fill="#B94350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="650" >to adapter</text><text x="90" y="815" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" >Concrete adapter types</text><text x="70" y="911" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" >Bootstrap wires implementations to ports. See the rulebook for the full scope.</text><path d="M70 930 L1130 930" fill="none" stroke="#DCE7EC" stroke-width="1.3" stroke-linecap="round" /><text x="70" y="950" fill="#587086" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" >Codegen Blueprint  /  Architecture as an Executable Contract</text></svg>