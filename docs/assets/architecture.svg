<svg xmlns="http://www.w3.org/2000/svg" width="760" height="868" viewBox="0 0 760 868" role="img" aria-labelledby="title description">
  <title id="title">Generated architecture boundaries</title>
  <desc id="description">Arrows point from the source to the referenced type or package. Standard controllers reference services, and services reference repositories, which can reference domain types. In Hexagonal, each adapter references its application port. The use case references the outbound port and domain. Bootstrap wires the implementations. Highlighted rows list selected prohibited references.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .code { font-family: Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="867" rx="16" fill="#F8FAFC" stroke="#D4DEE7"/>
  <text x="30" y="52" font-size="36" font-weight="700" fill="#192B45">Generated architecture boundaries</text>
  <text x="30" y="88" font-size="26" font-weight="400" fill="#475D73">Arrows point from source to dependency.</text>
  <rect x="16" y="112" width="728" height="272" rx="10" fill="#FFFFFF" stroke="none"/>
  <text x="34" y="159" font-size="34" font-weight="700" fill="#192B45">Standard</text>
  <text x="34" y="210" font-size="28" font-weight="400" fill="#192B45" class="code">controller</text>
  <path d="M238 200h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="210" font-size="28" font-weight="400" fill="#192B45" class="code">service</text>
  <path d="M423 200h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="210" font-size="28" font-weight="400" fill="#192B45" class="code">repository</text>
  <text x="34" y="262" font-size="28" font-weight="400" fill="#192B45" class="code">repository</text>
  <path d="M238 252h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="262" font-size="28" font-weight="400" fill="#192B45" class="code">domain</text>
  <rect x="34" y="296" width="692" height="68" rx="6" fill="#FCEDEF" stroke="none"/>
  <text x="51" y="338" font-size="24" font-weight="700" fill="#A63540">Forbidden</text>
  <text x="189" y="338" font-size="27" font-weight="400" fill="#A63540" class="code">controller → repository</text>
  <rect x="16" y="400" width="728" height="451" rx="10" fill="#FFFFFF" stroke="none"/>
  <text x="34" y="447" font-size="34" font-weight="700" fill="#192B45">Hexagonal</text>
  <text x="34" y="483" font-size="25" font-weight="400" fill="#475D73">Bootstrap wires ports and implementations.</text>
  <text x="34" y="536" font-size="28" font-weight="400" fill="#192B45" class="code">adapter.in</text>
  <path d="M260 526h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316" y="536" font-size="28" font-weight="400" fill="#192B45" class="code">application.port.in</text>
  <text x="34" y="588" font-size="28" font-weight="400" fill="#192B45" class="code">adapter.out</text>
  <path d="M260 578h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316" y="588" font-size="28" font-weight="400" fill="#192B45" class="code">application.port.out</text>
  <text x="34" y="640" font-size="28" font-weight="400" fill="#192B45">Use case</text>
  <path d="M260 630h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316" y="640" font-size="28" font-weight="400" fill="#192B45" class="code">application.port.out</text>
  <text x="34" y="692" font-size="28" font-weight="400" fill="#192B45">Use case</text>
  <path d="M260 682h30m-8 -7 8 7-8 7" fill="none" stroke="#087F73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316" y="692" font-size="28" font-weight="400" fill="#192B45" class="code">domain</text>
  <rect x="34" y="722" width="692" height="109" rx="6" fill="#FCEDEF" stroke="none"/>
  <text x="51" y="761" font-size="24" font-weight="700" fill="#A63540">Forbidden</text>
  <text x="189" y="761" font-size="27" font-weight="400" fill="#A63540" class="code">application → adapter</text>
  <text x="189" y="803" font-size="27" font-weight="400" fill="#A63540" class="code">domain → application</text>
</svg>
