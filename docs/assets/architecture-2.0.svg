<svg xmlns="http://www.w3.org/2000/svg" width="760" height="689" viewBox="0 0 760 689" role="img" aria-labelledby="title description">
  <title id="title">Source dependencies in Standard and Hexagonal layouts</title>
  <desc id="description">Selected edges covered by Basic and Strict. In Standard, controller depends on service and service depends on repository. Controller to repository is prohibited. In Hexagonal, inbound adapter depends on the input port, outbound adapter implements the output port, and the use case depends on the output port and domain. Application to adapter is prohibited. Bootstrap wires implementations.</desc>
  <defs>
    <marker id="allowed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#69e6bd" stroke-width="1.4"/></marker>
    <marker id="blocked" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#ff9f9e" stroke-width="1.4"/></marker>
  </defs>
  <rect width="760" height="689" rx="24" fill="#101826"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="54" font-size="36" font-weight="730" fill="#eff5ff">Source dependency directions</text>
    <text x="34" y="87" font-size="23" fill="#c3cede">Selected edges in Basic and Strict</text>
  </g>
  <g fill="#172436" stroke="#425670">
    <rect x="24" y="112" width="712" height="185" rx="16"/>
    <rect x="24" y="313" width="712" height="306" rx="16"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#eff5ff">
    <text x="46" y="154" font-size="31" font-weight="720">Standard</text>
    <text x="46" y="354" font-size="31" font-weight="720">Hexagonal</text>
    <text x="711" y="352" font-size="23" fill="#c3cede" text-anchor="end">Bootstrap wires adapters</text>
  </g>
  <g fill="#22354a" stroke="#536c88">
    <rect x="47" y="177" width="190" height="53" rx="8"/>
    <rect x="285" y="177" width="190" height="53" rx="8"/>
    <rect x="523" y="177" width="190" height="53" rx="8"/>
    <rect x="47" y="371" width="190" height="46" rx="8"/>
    <rect x="508" y="371" width="192" height="46" rx="8"/>
    <rect x="290" y="570" width="180" height="37" rx="7"/>
  </g>
  <rect x="37" y="440" width="667" height="116" rx="11" fill="#101826" stroke="#617791"/>
  <g fill="#22354a" stroke="#536c88">
    <rect x="47" y="453" width="190" height="42" rx="7"/>
    <rect x="508" y="453" width="192" height="42" rx="7"/>
    <rect x="290" y="507" width="180" height="38" rx="7"/>
  </g>
  <g fill="none" stroke="#69e6bd" stroke-width="3">
    <path d="M238 203h45" marker-end="url(#allowed)"/>
    <path d="M476 203h45" marker-end="url(#allowed)"/>
    <path d="M142 418v33" marker-end="url(#allowed)"/>
    <path d="M604 418v33" marker-end="url(#allowed)"/>
    <path d="M471 526h133v-29" marker-end="url(#allowed)"/>
    <path d="M380 546v22" marker-end="url(#allowed)"/>
  </g>
  <g fill="none" stroke="#ff9f9e" stroke-width="2.7" stroke-dasharray="7 5">
    <path d="M142 231v27h476v-26" marker-end="url(#blocked)"/>
    <path d="M705 525h20V394h-23" marker-end="url(#blocked)"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#eff5ff" text-anchor="middle">
    <text x="142" y="213">controller</text><text x="380" y="213">service</text><text x="618" y="213">repository</text>
    <text x="142" y="403">adapter.in</text><text x="604" y="403">adapter.out</text>
    <text x="142" y="483">port.in</text><text x="604" y="483">port.out</text>
    <text x="380" y="535">use case</text><text x="380" y="598">domain</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="22">
    <rect x="230" y="244" width="300" height="34" rx="6" fill="#172436"/>
    <text x="380" y="268" fill="#ffb9b6" text-anchor="middle">Direct dependency blocked</text>
    <text x="380" y="480" fill="#c3cede" text-anchor="middle" font-weight="650">Application</text>
    <text x="590" y="435" fill="#a1f1d5" text-anchor="end" font-size="20">implements</text>
    <path d="M40 653h38" stroke="#69e6bd" stroke-width="3" marker-end="url(#allowed)"/>
    <text x="91" y="660" fill="#eff5ff">Permitted</text>
    <path d="M340 653h38" stroke="#ff9f9e" stroke-width="2.7" stroke-dasharray="7 5" marker-end="url(#blocked)"/>
    <text x="392" y="660" fill="#ffb9b6">Prohibited</text>
  </g>
</svg>
