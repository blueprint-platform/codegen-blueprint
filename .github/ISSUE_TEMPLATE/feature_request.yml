name: Feature request
description: Propose a change to generation, architecture checks, or developer workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: Describe what you are trying to do and where the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the observable outcome and any affected layout, guardrail, or generated artifact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe workarounds you tried and any trade-offs worth considering.
