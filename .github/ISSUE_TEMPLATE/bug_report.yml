name: Bug report
description: Report a reproducible CLI, generated build, or guardrail problem.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Identify the affected command, generated artifact, or architecture rule.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the full generator command, the build command, and any source changes needed to reproduce the result. Redact secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Codegen Blueprint version or commit, OS, generator and project JDKs, Maven wrapper version, and the resolved Boot patch and source printed by the CLI.
      placeholder: |
        Codegen Blueprint 2.0.0-SNAPSHOT (commit)
        Linux, generator JDK 21, project JDK 25, Maven 3.9.16
        bootSelector=4.2 bootVersion=4.2.0 source=BUNDLED_FALLBACK
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Build or rule evidence
      description: Include the relevant log excerpt or report name. For an ArchUnit failure, include the assertion and dependency it reports.
