name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * 2'

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: |
            ci
            scripts
      - name: Install the reference Maven
        run: bash ci/install-reference-maven.sh
      - run: mvn -B -ntp clean verify
      - name: Upload coverage
        if: github.event_name != 'schedule'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
          flags: codegen-blueprint
          fail_ci_if_error: false
      - name: Stage generator JAR
        run: |
          final_name="$(mvn -q -ntp help:evaluate -Dexpression=project.build.finalName -DforceStdout)"
          mkdir -p target/delivery
          cp "target/$final_name.jar" target/delivery/
          printf '%s.jar\n' "$final_name" > target/delivery/name
          project_version="$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          java -jar "target/$final_name.jar" --cli --version | grep -Fx "$project_version"
          (cd target/delivery && sha256sum "$final_name.jar" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: generator
          path: target/delivery/
          if-no-files-found: error

  generated:
    if: github.event_name != 'schedule'
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        boot: ['4.1', '4.2']
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            25
            ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: generator
          path: target/delivery
      - name: Verify generated outputs
        env:
          BOOT_VERSION: ${{ matrix.boot }}
          JAVA_VERSION: ${{ matrix.java }}
          PROOF_OUTPUT_ROOT: ${{ runner.temp }}/architecture-proof
          VERIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'standard' }}
        run: |
          (cd target/delivery && sha256sum -c SHA256SUMS)
          CODEGEN_JAR="$PWD/target/delivery/$(cat target/delivery/name)"
          export CODEGEN_JAR
          export GENERATOR_JAVA="$JAVA_HOME_25_X64/bin/java"
          bash ci/verify-generated.sh "$VERIFICATION_MODE"
      - name: Save architecture proof
        if: always() && (github.event_name == 'workflow_dispatch' || (matrix.boot == '4.2' && matrix.java == '25'))
        uses: actions/upload-artifact@v4
        with:
          name: architecture-proof-boot-${{ matrix.boot }}-java-${{ matrix.java }}
          path: ${{ runner.temp }}/architecture-proof/
          if-no-files-found: warn
      - name: Check a cold generated wrapper and test fork
        if: github.event_name == 'workflow_dispatch' && matrix.boot == '4.2'
        env:
          EXPECT_BOOT_SOURCE: BUNDLED_FALLBACK
          JAVA_VERSION: ${{ matrix.java }}
          LAYOUT: hexagonal
          GUARDRAILS: strict
          SAMPLE_CODE: basic
        run: |
          CODEGEN_JAR="$PWD/target/delivery/$(cat target/delivery/name)"
          export CODEGEN_JAR
          export MAVEN_USER_HOME="$RUNNER_TEMP/cold-wrapper"
          export MAVEN_OPTS="-Dmaven.repo.local=$RUNNER_TEMP/cold-repository"
          GENERATOR_JAVA="$JAVA_HOME_25_X64/bin/java" bash ci/verify-project.sh

  quickstart:
    if: github.event_name != 'schedule'
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: generator
          path: target/delivery
      - run: |
          (cd target/delivery && sha256sum -c SHA256SUMS)
          jar="$PWD/target/delivery/$(cat target/delivery/name)"
          python3 scripts/verify-quickstart.py "$jar"
          bash scripts/refresh-generated-readmes.sh "$jar" --check

  upstream:
    if: github.event_name == 'schedule'
    needs: engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['4.1', '4.2']
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            25
            ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: generator
          path: target/delivery
      - name: Verify the published candidate
        env:
          BOOT_VERSION: ${{ matrix.boot }}
          JAVA_VERSION: ${{ matrix.java }}
          EXPECT_BOOT_SOURCE: CENTRAL_LATEST
          LAYOUT: hexagonal
          GUARDRAILS: strict
          SAMPLE_CODE: basic
        run: |
          (cd target/delivery && sha256sum -c SHA256SUMS)
          CODEGEN_JAR="$PWD/target/delivery/$(cat target/delivery/name)"
          export CODEGEN_JAR
          GENERATOR_JAVA="$JAVA_HOME_25_X64/bin/java" bash ci/verify-project.sh
