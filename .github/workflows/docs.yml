name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
      - 'ci/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
      - 'ci/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/**'
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Deploy the verified main-branch Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scripts/pages/requirements.txt
      - run: python scripts/build-docs.py target/pages
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: target/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
        with:
          path: target/pages

  deployment-quickstart:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash ci/install-reference-maven.sh
      - name: Execute the documented quickstart
        run: |
          mvn -B -ntp clean package
          final_name="$(mvn -q -ntp help:evaluate -Dexpression=project.build.finalName -DforceStdout)"
          python3 scripts/verify-quickstart.py "target/$final_name.jar"
          bash scripts/refresh-generated-readmes.sh "target/$final_name.jar" --check

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
    needs: [pages, deployment-quickstart]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
